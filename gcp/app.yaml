# Google App Engine configuration for Skill Bridge Backend
runtime: nodejs18

env: standard

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: production
  PORT: 8080

handlers:
  - url: /api/.*
    script: auto
    secure: always

  - url: /.*
    script: auto
    secure: always
