# ============================================
# Skill Bridge - Google Cloud Build CI/CD
# ============================================
steps:
  # Step 1: Install backend dependencies
  - name: 'node:18'
    dir: 'backend'
    entrypoint: 'npm'
    args: ['install']
    id: 'install-backend'

  # Step 2: Install frontend dependencies
  - name: 'node:18'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['install']
    id: 'install-frontend'

  # Step 3: Build frontend
  - name: 'node:18'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_URL=https://skillbridge-backend-xxxx-uc.a.run.app/api'
    id: 'build-frontend'
    waitFor: ['install-frontend']

  # Step 4: Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/skillbridge-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/skillbridge-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'
    id: 'build-backend-image'
    waitFor: ['install-backend']

  # Step 5: Push backend image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/skillbridge-backend:$COMMIT_SHA'
    id: 'push-backend-image'
    waitFor: ['build-backend-image']

  # Step 6: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'skillbridge-backend'
      - '--image=gcr.io/$PROJECT_ID/skillbridge-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'
      - '--memory=512Mi'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-backend'
    waitFor: ['push-backend-image']

  # Step 7: Deploy frontend to Firebase Hosting
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        cd frontend
        firebase deploy --only hosting --token=$$FIREBASE_TOKEN
    secretEnv: ['FIREBASE_TOKEN']
    id: 'deploy-frontend'
    waitFor: ['build-frontend']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-token/versions/latest
      env: 'FIREBASE_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
