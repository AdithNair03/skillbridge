name: Skill Bridge CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── JOB 1: TEST ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Verify backend starts
        run: |
          cd backend
          node -e "
            const express = require('express');
            const app = express();
            app.get('/health', (req, res) => res.json({ status: 'ok' }));
            const server = app.listen(5001, () => {
              console.log('Health check passed!');
              server.close();
            });
          "

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://skillbridge-api-ydyr.onrender.com/api

  # ─── JOB 2: BUILD DOCKER IMAGE ─────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skillbridge-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/skillbridge-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skillbridge-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/skillbridge-frontend:${{ github.sha }}

  # ─── JOB 3: DEPLOY ─────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy backend to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Backend deployment triggered!"

      - name: Notify deployment success
        run: |
          echo "=========================================="
          echo "  SKILL BRIDGE DEPLOYED SUCCESSFULLY!"
          echo "  Frontend: https://skillbridge-henna.vercel.app"
          echo "  Backend:  https://skillbridge-api-ydyr.onrender.com"
          echo "=========================================="
